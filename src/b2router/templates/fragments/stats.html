<div class="stats">
    <div class="stat">
        <div class="stat-label">Total Free Space</div>
        <div class="stat-value">{{ stats.total_free_space }}</div>
    </div>
    <div class="stat">
        <div class="stat-label">Total Used Space</div>
        <div class="stat-value">{{ stats.total_used_space }}</div>
    </div>
    <div class="stat">
        <div class="stat-label">Number of Files</div>
        <div class="stat-value">{{ stats.number_of_files }}</div>
    </div>
    <div class="stat">
        <div class="stat-label">Number of Accounts</div>
        <div class="stat-value">{{ stats.number_of_accounts }}</div>
    </div>
</div>

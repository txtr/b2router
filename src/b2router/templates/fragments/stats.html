<div class="stats">
    <div class="stat">
        <div class="stat-label">Unique Files</div>
        <div class="stat-value">{{ stats.unique_files }}</div>
    </div>
    <div class="stat">
        <div class="stat-label">Total Size</div>
        <div class="stat-value">{{ stats.total_size_mb }} MB</div>
    </div>
    <div class="stat">
        <div class="stat-label">Total References</div>
        <div class="stat-value">{{ stats.total_account_references }}</div>
    </div>
    <div class="stat">
        <div class="stat-label">Accounts with Files</div>
        <div class="stat-value">{{ stats.accounts_with_files }}</div>
    </div>
</div>

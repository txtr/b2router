<form hx-post="/upload"
      hx-target="#upload-region"
      hx-swap="innerHTML"
      enctype="multipart/form-data">
    {% if messages %}
        {% for m in messages %}
        <div class="alert alert-{{ m.type }}">{{ m.text }}</div>
        {% endfor %}
    {% endif %}

    <div class="upload-dropzone">
        <label for="file" class="dropzone-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 16.5v1.875a2.25 2.25 0 0 0 2.25 2.25H18.75a2.25 2.25 0 0 0 2.25-2.25V16.5"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 3.75l3.75 3.75M12 3.75L8.25 7.5M12 3.75V15"/>
            </svg>
            <span>Drop files here or click to browse</span>
        </label>
        <input type="file"
               id="file"
               name="file"
               multiple
               class="file-input"
               required>
    </div>

    <div id="selected-files" class="selected-files" aria-live="polite"></div>

    <button type="submit" class="btn btn-success">Upload</button>
</form>

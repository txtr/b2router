<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · b2router</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234fd1c5'/%3E%3Cpath d='M26 32h48v12H26zm0 24h30v12H26z' fill='%2304120f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 1.25rem;">
    <div class="glass fade-in" style="width: min(420px, 100%); padding: 1.6rem;">
      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="brand-mark"><i class="bi bi-shield-lock"></i></span>
        <div>
          <h1 class="h5 mb-0">Operator sign-in</h1>
          <div class="text-secondary small">This gateway requires a shared token.</div>
        </div>
      </div>

      {% if error %}
        <div class="alert alert-danger d-flex gap-2 align-items-start" role="alert">
          <i class="bi bi-exclamation-octagon mt-1"></i><div>{{ error }}</div>
        </div>
      {% endif %}

      <form method="post" action="{{ url_for('ui.login') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label class="form-label small text-secondary" for="token">Bearer token</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input class="form-control" id="token" name="token" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button class="btn btn-accent w-100" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Continue
        </button>
      </form>

      <p class="text-secondary small mt-3 mb-0">
        The token is <code>B2ROUTER_API_TOKEN</code>. The session cookie is HttpOnly and SameSite=Strict.
      </p>
    </div>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>

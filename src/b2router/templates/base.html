<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B2 Router{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/">Files</a>
            <a href="#upload-region">Upload</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
    <script>
      /* Show selected (not-yet-uploaded) files. Delegates on document so the
         listener survives HTMX swaps of #upload-region. */
      document.addEventListener('change', function (e) {
        if (e.target.type !== 'file') return;
        var indicator = document.getElementById('selected-files');
        if (!indicator) return;
        indicator.innerHTML = '';
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        var list = document.createElement('ul');
        list.className = 'file-list';
        files.forEach(function (f) {
          var li = document.createElement('li');
          li.className = 'file-item';
          var size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB'
                     : f.size > 1024  ? (f.size / 1024).toFixed(1) + ' KB'
                                     : f.size + ' B';
          li.textContent = f.name + ' • ' + size;
          list.appendChild(li);
        });
        indicator.appendChild(list);
      });
    </script>
</body>
</html>

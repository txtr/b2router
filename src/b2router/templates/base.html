<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B2 Router{% endblock %}</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --card: #f9fafb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --success-bg: #f0fdf4;
            --code-bg: #f3f4f6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --fg: #f1f5f9;
                --muted: #94a3b8;
                --border: #334155;
                --card: #1e293b;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --success: #22c55e;
                --success-hover: #4ade80;
                --error: #ef4444;
                --error-bg: #450a0a;
                --success-bg: #052e16;
                --code-bg: #1e293b;
            }
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 1rem;
            background: var(--bg); color: var(--fg);
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        @media (min-width: 641px) {
            body { padding: 2rem; }
        }
        h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
        h2 { font-size: 1.25rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; color: var(--muted); }
        p { color: var(--muted); margin-bottom: 1rem; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .nav a { margin-right: 1.5rem; font-weight: 500; }
        .stats { display: flex; gap: 1.5rem; margin: 1.5rem 0; flex-wrap: wrap; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.5rem; }
        .stat-label { font-size: 0.875rem; color: var(--muted); }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--fg); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--card); }
        tr:hover td { background: var(--card); }
        code { background: var(--code-bg); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
        .badge { display: inline-block; background: var(--card); border: 1px solid var(--border); padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.35rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); text-decoration: none; }
        .btn:disabled { background: var(--muted); cursor: not-allowed; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        input[type="file"] { display: block; width: 100%; max-width: 400px; padding: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
        input[type="search"] { width: 100%; max-width: 300px; padding: 0.5rem 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        .upload-form { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
        .alert { padding: 1rem 1.25rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
        .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
        .toolbar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .empty { text-align: center; padding: 3rem; color: var(--muted); }
        .size { font-family: ui-monospace, SFMono-Regular, monospace; white-space: nowrap; }
        .actions { display: flex; gap: 0.5rem; }
        /* --- Responsive layout --- */
        .table-wrapper {
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 820px; font-size: 0.9rem; }
        th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        @media (max-width: 640px) {
            th, td { padding: 0.4rem 0.5rem; font-size: 0.8rem; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .stat { flex: 1 1 100%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/">Files</a>
            <a href="/upload">Upload</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

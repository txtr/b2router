{% extends "base.html" %}
{% block title %}B2 Router — File Cache{% endblock %}
{% block content %}
<h1>B2 Router</h1>
<p>Centralized view of files across all B2 accounts</p>

<div id="stats-region">
    {% include "fragments/stats.html" %}
</div>

<div class="toolbar">
    <input type="search"
           name="q"
           id="fileSearch"
           placeholder="Filter files…"
           hx-get="/files"
           hx-trigger="keyup delay:250ms, change"
           hx-target="#file-table">
</div>

<div id="file-table">
    {% include "fragments/files_table.html" %}
</div>

<hr>

<div id="upload-region">
    {% include "fragments/upload_form.html" %}
</div>
{% endblock %}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install b2sdk pyyaml

      - name: Run syntax check
        run: python -m py_compile b2.py

      - name: Run tests
        run: python test_bugs.py -v

      - name: Run type checking
        run: |
          pip install mypy types-requests
          mypy b2.py --ignore-missing-imports

      - name: Run linting
        run: |
          pip install ruff
          ruff check b2.py || echo "Linting issues found (non-blocking)"
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: b2router:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm --entrypoint python b2router:latest -m py_compile b2.py
          docker run --rm --entrypoint python b2router:latest test_bugs.py

  release:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}